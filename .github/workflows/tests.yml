name: 'Manual Execução'

on:
  push:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
    

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando dependências
        run: npm ci

      - name: Verificando secrets
        run: |
          if [ -n "$ADMIN_EMAIL" ]; then echo "ADMIN_EMAIL definido"; else echo "ADMIN_EMAIL vazio"; fi
          if [ -n "$ADMIN_SENHA" ]; then echo "ADMIN_SENHA definido"; else echo "ADMIN_SENHA vazio"; fi
          if [ -n "$BASE_URL" ]; then echo "BASE_URL definido"; else echo "BASE_URL vazio"; fi  

      - name: Subindo a API
        run: npm start &

      - name: Executando os testes
        run: npx mocha

